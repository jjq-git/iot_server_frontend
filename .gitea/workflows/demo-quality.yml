name: Demo quality gate

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  validate-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static and architecture checks
        run: |
          npm run lint
          npm run lint:style
          npm run test:architecture

      - name: Run unit and contract tests
        run: npm test

      - name: Audit synthetic Demo data
        run: |
          npm run verify:demo-contracts
          npm run audit:demo-data -- --output demo-data-audit.json

      - name: Build backend artifact
        run: npm run build

      - name: Build and verify Demo artifact
        run: |
          npm run build:demo
          npm run verify:demo-artifact

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Demo browser matrix
        run: npm run test:browser

      - name: Preserve Demo validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-quality-evidence-${{ gitea.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            demo-data-audit.json
            tests/fixtures/demo/manifest.json
            dist-demo/build-info.json
            playwright-report/
            test-results/
